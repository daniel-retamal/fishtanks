[package]
name = "fishtanks"
version = "1.1.0"
edition = "2024"
description = "An aquarium for your terminal: ASCII fishes, fishing, a shop, mutations, heaven, hell and computers made of fish."
license = "MIT"
repository = "https://github.com/daniel-retamal/fishtanks"
homepage = "https://retam.al/fishtanks"
readme = "README.md"
keywords = ["aquarium", "game", "terminal", "ascii", "tui"]
categories = ["games", "command-line-utilities"]
exclude = ["tests/", ".github/"]

[lib]
name = "fishtank"

[dependencies]
anyhow = "1.0.102"
crossterm = "0.29.0"
dirs = "7.0.0"
rand = "0.10.1"
ratatui = { version = "0.30.0", features = ["serde"] }
ron = "0.12.2"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[profile.dist]
inherits = "release"
lto = "thin"
