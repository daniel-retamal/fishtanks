name: verify
on:
  push:
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci
      - run: cargo build
      - name: It lets go when its window closes
        if: runner.os != 'Windows'
        shell: bash
        env:
          FISHTANKS_NO_UPDATE_CHECK: "1"
          TERM: xterm-256color
        run: |
          export HOME="$(mktemp -d)"
          game="$PWD/target/debug/fishtanks"
          if [ "$RUNNER_OS" = "macOS" ]; then
            script -q /dev/null "$game" > /dev/null &
          else
            script -qec "$game" /dev/null > /dev/null &
          fi
          window=$!
          sleep 4
          pgrep -f "$game" > /dev/null
          kill -KILL "$window"
          for second in $(seq 1 15); do
            pgrep -f "$game" > /dev/null || break
            sleep 1
          done
          if pgrep -f "$game" > /dev/null; then
            echo "fishtanks is still swimming after its window closed"
            ps -o pid,stat,pcpu,command -p "$(pgrep -f "$game" | head -1)"
            pkill -KILL -f "$game"
            exit 1
          fi
          echo "fishtanks let go of its window"
